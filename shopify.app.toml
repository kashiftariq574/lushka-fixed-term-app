# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d3458017a2f675aa32b1df7963859d65"
application_url = "https://lushka-app-production.up.railway.app"
embedded = true
name = "lushka-fixed-term-app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_customer_payment_methods,read_own_subscription_contracts,write_own_subscription_contracts,read_orders,write_orders,read_inventory,write_inventory,read_locations,read_customers,write_customers,read_metaobjects,read_metaobject_definitions,write_discounts"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/challenged"
  topics = [ "subscription_billing_attempts/challenged" ]


  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/create"
  topics = [ "subscription_contracts/create" ]

[[webhooks.subscriptions]]
uri = "/webhooks/subscription_contracts/update"
topics = [ "subscription_contracts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = [ "orders/updated" ]

[auth]
redirect_urls = [ "https://lushka-app-production.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
