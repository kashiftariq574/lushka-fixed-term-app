# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6a3a15966a11263f8f2556c2577cade2"
application_url = "https://lushka-app-staging.up.railway.app"
embedded = true
name = "lushka-fixed-term-app-staging"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_customer_payment_methods,read_own_subscription_contracts,write_own_subscription_contracts,read_orders,read_inventory,write_inventory,read_locations"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/challenged"
  topics = [ "subscription_billing_attempts/challenged" ]


  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/create"
  topics = [ "subscription_contracts/create" ]

[[webhooks.subscriptions]]
uri = "/webhooks/subscription_contracts/update"
topics = [ "subscription_contracts/update" ]

[auth]
redirect_urls = [ "https://lushka-app-staging.up.railway.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
